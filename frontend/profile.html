<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerHub - Profile</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="auth-guard.js"></script>
</head>
<body>

<!--Header/Nav-->
<header>
  <h2>CareerHub</h2>
  <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')">&#9776;</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="applications.html">Applications</a>
    <a href="saved-jobs.html">Saved</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<!--Profile Content-->
<div class="container">

  <div id="profileAlert" class="alert alert-success"></div>

  <div class="profile-header">
    <div class="profile-avatar" id="profileAvatar">--</div>
    <div class="profile-info">
      <h2 id="profileDisplayName">Loading...</h2>
      <p id="profileSchool"></p>
      <p style="font-size:.85rem; color:#999;" id="profileLocationEmail"></p>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">

    <!-- About/Bio -->
    <div class="card">
      <div class="profile-section">
        <h3>About</h3>
        <p id="bioText"></p>
        <button class="btn btn-outline btn-sm" style="margin-top:10px;" onclick="editBio()">Edit</button>
      </div>

      <div class="profile-section">
        <h3>Skills</h3>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;" id="skillsList">
        </div>

        <div style="display:flex; gap:8px;">
          <input type="text" id="newSkillInput" placeholder="e.g. Python" style="flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <button class="btn btn-outline btn-sm" onclick="addSkill()">Add</button>
        </div>

      </div>
    </div>

    <!-- Experience & Education -->
    <div class="card">
      <div class="profile-section">
        <h3>Education</h3>
        <div id="educationList"></div>

        <div style="display:grid; gap:8px; margin-top:12px;">
          <input type="text" id="newEduDegree" placeholder="Degree (e.g. B.S. Computer Science)" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="newEduInstitution" placeholder="Institution" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="newEduGradDate" placeholder="Expected grad (e.g. May 2027)" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <button class="btn btn-outline btn-sm" onclick="addEducation()">Add Education</button>
        </div>

      </div>

      <div class="profile-section">
        <h3>Experience</h3>
        <div id="experienceList"></div>

        <div style="display:grid; gap:8px; margin-top:12px;">
          <input type="text" id="newExpTitle" placeholder="Job title" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="newExpCompany" placeholder="Company" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <input type="text" id="newExpDateRange" placeholder="Date range (e.g. Summer 2025)" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px;">
          <textarea id="newExpDescription" placeholder="Description" style="padding:8px 10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>
          <button class="btn btn-outline btn-sm" onclick="addExperience()">Add Experience</button>
        </div>

      </div>
    </div>

  </div>

  <!-- Account Settings -->
  <div class="card" style="margin-top:24px;">
    <h2>Account Settings</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px;">
      <div class="form-group">
        <label for="profileName">Full Name</label>
        <input type="text" id="profileName">
      </div>
      <div class="form-group">
        <label for="profileEmail">Email</label>
        <input type="email" id="profileEmail" disabled>
      </div>
      <div class="form-group">
        <label for="profileLocation">Location</label>
        <input type="text" id="profileLocation">
      </div>
      <div class="form-group">
        <label for="profilePhone">Phone</label>
        <input type="tel" id="profilePhone">
      </div>
    </div>
    <button class="btn btn-primary" style="margin-top:10px;" onclick="saveSettings()">Save Changes</button>
  </div>

</div>

<!--Footer-->
<footer>
  <p>&copy; 2026 CareerHub &mdash; COMP4650 Web Dev Project</p>
</footer>

<script src="profile.js"></script>

</body>
</html>
