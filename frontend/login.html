<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerHub - Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<!--Header/Nav-->
<header>
  <h2>CarrerHub</h2>
  <button class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('open')">&#9776;</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="applications.html">Applications</a>
    <a href="saved-jobs.html">Saved</a>
    <a href="profile.html">Profile</a>
    <a href="login.html" class="active">Login</a>
  </nav>
</header>

<!--Login Form-->
<div class="form-page">
  <div class="form-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to manage your job search</p>

    <div id="loginAlert" class="alert alert-error"></div>

    <!-- Email -->
    <div class="form-group" id="emailGroup">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
      <div class="error-msg" id="emailError">Enter a valid email address.</div>
    </div>

    <!-- Password -->
    <div class="form-group" id="passwordGroup">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Your password">
      <div class="error-msg" id="passwordError">Password is required.</div>
    </div>

    <button class="btn btn-primary btn-block" onclick="handleLogin()">Log In</button>

    <p class="form-link">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>
</div>

<!--Footer-->
<footer>
  <p>&copy; 2026 CareerHub &mdash; COMP4650 Web Dev Project</p>
</footer>

<script src="login.js"></script>

</body>
</html>
